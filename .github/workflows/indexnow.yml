name: IndexNow

# Tells Bing, Yandex and other IndexNow search engines to recrawl the
# pages in sitemap.xml after each change to the live site.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for GitHub Pages to publish
        run: sleep 120

      - name: Submit sitemap URLs
        env:
          HOST: commercialevs.co.uk
          KEY: 48d8db0c80f244ec719548ce4e0758a7
        run: |
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -s .)
          body=$(jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')
          echo "$body"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow response: $status"
          case "$status" in 200|202) ;; *) exit 1 ;; esac
