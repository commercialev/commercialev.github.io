<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="t d">
<title id="t">Electric van sales against the ZEV mandate target, 2024 to 2030</title>
<desc id="d">Battery-electric vans were 6.3% of new UK van sales in 2024 against a 10% target, 9.5% in 2025 against 16%, and 10.8% from January to September 2026 against 24%. The van target rises to 34% in 2027, 46% in 2028, 58% in 2029 and 70% in 2030. The 2026 review proposes 60%, 50% or 40% for 2030, or keeping 70% with longer flexibilities.</desc>
